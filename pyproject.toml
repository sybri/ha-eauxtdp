[project]
name = "ha-eauxtdp"
version = "1.0.0"
description = "Intégration Home Assistant pour le portail Eaux Terre de Provence (portail.eauxtdp.fr)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
