name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify integration manifest version matches tag
        run: |
          MANIFEST_VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/eauxtdp/manifest.json"))["version"])')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) != tag ($TAG)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Consultez [CHANGELOG.md](https://github.com/sybri/ha-eauxtdp/blob/main/CHANGELOG.md) pour le détail des changements.
